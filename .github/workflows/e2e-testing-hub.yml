name: e2e Integration Hub

# Dispatched by payconnect-testing-hub's GitHubService.DispatchRepositoryEvent
# (see TRD "Acción E2E unificada en e2e-testing + manifest de discovery").
# Serves both existing trigger flows: psp-wide (PROCESSOR_ID/TEST_CONFIGS,
# @integration-hub tag) and merchant-granularity (VERSION_ID/ENTITY_ID,
# @ihub-general/@ihub-{psp} tags) — they share this one event and job.
on:
  repository_dispatch:
    types: [run-e2e-integration-hub]

jobs:
  tests:
    name: Run Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: staging-regressions-test

    env:
      TEST_GREP: ${{ github.event.client_payload.grep }}
      PROCESSOR_ID: ${{ github.event.client_payload.processor_id }}
      PROCESSOR_NAME: ${{ github.event.client_payload.processor_name }}
      TEST_CONFIGS: ${{ github.event.client_payload.test_configs }}
      VERSION_ID: ${{ github.event.client_payload.version_id }}
      PAYCONNECT_TESTING_HUB_API_KEY: ${{ github.event.client_payload.testing_hub_api_key }}
      PAYCONNECT_TESTING_HUB_URL: ${{ github.event.client_payload.testing_hub_url }}
      VERSION: ${{ github.event.client_payload.version }}
    steps:
      # No cross-repo checkout: this workflow lives in e2e-testing now, so
      # the dispatch's own branch is already what's checked out.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.client_payload.branch || 'develop' }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          if [ -z "$TEST_GREP" ]; then
            echo "No grep provided, running all tests"
            CI=true npx playwright test @QA-T434 --project=chromium --workers 1
          else
            echo "Running tests with grep: $TEST_GREP"
            CI=true npx playwright test playwright/tests/integration-hub --grep "$TEST_GREP" --project=chromium --workers 1
          fi
        env:
          NODE_ENV: staging
          NODE_OPTIONS: "--max-old-space-size=4096"
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          METABASE_USER: ${{ secrets.METABASE_USER }}
          MB_USER: ${{ secrets.METABASE_USER }}
          MB_PASSWORD: ${{ secrets.METABASE_PASSWORD }}

      - name: Upload blob report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report
          path: ./blob-report/
          retention-days: 1
